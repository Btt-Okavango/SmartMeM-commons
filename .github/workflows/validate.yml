name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  proposals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test validator
        run: node --test scripts/validate.test.mjs

      - name: Validate proposals and releases
        run: node scripts/validate.mjs --all
